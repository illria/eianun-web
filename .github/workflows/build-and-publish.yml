name: Build and publish Alpine static site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eianun-pages-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate vinext build
        run: pnpm run build

      - name: Build static server package
        run: pnpm run build:static

      - name: Publish static package
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist-static
          force_orphan: true
          keep_files: false
